name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck --version && shellcheck install.sh uninstall.sh bin/*.sh test/test_helper.bash

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: git clone --quiet --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
      - name: Show tool versions
        run: |
          /bin/bash --version | head -n 1
          jq --version
          "$RUNNER_TEMP/bats-core/bin/bats" --version
      - name: Run tests
        run: "$RUNNER_TEMP/bats-core/bin/bats" --print-output-on-failure test
